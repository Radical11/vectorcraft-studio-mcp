name: Self-contained companion checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python scripts/test_suite.py --unit-only
      - run: python scripts/check_public.py
      - run: python docs/peer-review/check.py
      - run: python scripts/prepare_release.py --check
# Native Windows engine/desktop and actual image judgments are verified locally.
