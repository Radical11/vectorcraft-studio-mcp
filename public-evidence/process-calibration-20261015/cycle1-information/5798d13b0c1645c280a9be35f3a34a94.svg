<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
  <title>paired-process</title>
  <g id="Layer_1" data-name="Layer 1">
    <path d="M0 0 L1200 0 L1200 900 L0 900 Z" fill="#f7f4e8"/>
    <text transform="matrix(1 0 0 1 58 106)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="62" font-weight="bold" fill="#183c38"><tspan x="0" y="0">How trees cool a street</tspan></text>
    <text transform="matrix(1 0 0 1 60 155)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Two ways: shade surfaces and cool nearby air.</tspan></text>
    <text transform="matrix(1 0 0 1 60 240)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="31" font-weight="bold" fill="#183c38"><tspan x="0" y="0">1  Shade: less surface heating</tspan></text>
    <text transform="matrix(1 0 0 1 660 240)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="31" font-weight="bold" fill="#183c38"><tspan x="0" y="0">2  Evapotranspiration</tspan></text>
    <text transform="matrix(1 0 0 1 60 280)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Leaves intercept sunlight.</tspan></text>
    <text transform="matrix(1 0 0 1 60 315)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Less solar energy reaches pavement.</tspan></text>
    <text transform="matrix(1 0 0 1 660 280)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Soil water travels from roots to leaves.</tspan></text>
    <text transform="matrix(1 0 0 1 660 315)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Evaporation uses heat; air can cool.</tspan></text>
