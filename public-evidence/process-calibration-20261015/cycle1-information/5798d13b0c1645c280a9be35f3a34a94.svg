    <text transform="matrix(1 0 0 1 304 706)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="21" fill="#183c38"><tspan x="0" y="0">SHADED</tspan></text>
    <text transform="matrix(1 0 0 1 672 681)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="21" fill="#183c38"><tspan x="0" y="0">WATER IN SOIL</tspan></text>
    <text transform="matrix(1 0 0 1 60 806)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="25" fill="#183c38"><tspan x="0" y="0">Cooling depends on tree cover, water availability and local conditions.</tspan></text>
    <text transform="matrix(1 0 0 1 60 844)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="20" fill="#183c38"><tspan x="0" y="0">Concept diagram / not a planting specification.</tspan></text>
    <text transform="matrix(1 0 0 1 60 875)" x="0" y="0" xml:space="preserve" font-family="Arial" font-size="19" fill="#183c38"><tspan x="0" y="0">Sources: US EPA; US Forest Service (2024).</tspan></text>
