<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Locked evaluation urban-heat</title>
  <g id="Layer_1" data-name="Layer 1">
    <path d="M0 0 L1200 0 L1200 900 L0 900 Z" fill="#f4f0e5" stroke="#000000" stroke-miterlimit="10"/>
    <text id="eyebrow" transform="matrix(1 0 0 1 60 57)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#567768"><tspan x="0" y="0">URBAN HEAT / TWO COOLING PATHWAYS</tspan></text>
    <text id="title" transform="matrix(1 0 0 1 56 128)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="63" fill="#153d3a"><tspan x="0" y="0">How trees cool a street.</tspan></text>
    <text id="intro" transform="matrix(1 0 0 1 60 190)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="25" fill="#153d3a"><tspan x="0" y="0">A canopy changes what reaches the ground — and what leaves the tree.</tspan></text>
    <text id="shade-title" transform="matrix(1 0 0 1 60 302)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="28" fill="#153d3a"><tspan x="0" y="0">1  SHADE</tspan></text>
    <text id="shade-copy" transform="matrix(1 0 0 1 60 348)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="23" fill="#153d3a"><tspan x="0" y="0">Leaves intercept</tspan><tspan x="0" y="31">sunlight before it</tspan><tspan x="0" y="62">heats the surface.</tspan></text>
    <text id="water-title" transform="matrix(1 0 0 1 700 259)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="25" fill="#153d3a"><tspan x="0" y="0">2  EVAPOTRANSPIRATION</tspan></text>
    <text id="water-copy" transform="matrix(1 0 0 1 778 330)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="23" fill="#153d3a"><tspan x="0" y="0">Water leaves foliage as vapour.</tspan><tspan x="0" y="30">Evaporation uses energy,</tspan><tspan x="0" y="60">helping cool the surrounding air.</tspan></text>
    <text id="cool-ground" transform="matrix(1 0 0 1 80 533)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#50725e"><tspan x="0" y="0">Shaded surface</tspan></text>
    <text id="warm-ground" transform="matrix(1 0 0 1 846 729)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#a36f34"><tspan x="0" y="0">Sunlit surface</tspan></text>
    <text id="root" transform="matrix(1 0 0 1 71 729)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#237c87"><tspan x="0" y="0">Water taken up by roots</tspan></text>
    <text id="note" transform="matrix(1 0 0 1 60 828)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#567768"><tspan x="0" y="0">Cooling varies with tree cover, water availability and local conditions.</tspan></text>
    <text id="source" transform="matrix(1 0 0 1 60 874)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="20" fill="#567768"><tspan x="0" y="0">Concept diagram | Source: US EPA, Benefits of Trees and Vegetation.</tspan></text>
