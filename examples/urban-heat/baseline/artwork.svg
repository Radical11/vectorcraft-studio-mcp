  <title>Locked evaluation urban-heat</title>
  <g id="Layer_1" data-name="Layer 1">
    <path d="M0 0 L1200 0 L1200 900 L0 900 Z" fill="#f4f0e5" stroke="#000000" stroke-miterlimit="10"/>
    <text id="title" transform="matrix(1 0 0 1 60 126)" x="0" y="0" xml:space="preserve" font-family="Georgia" font-size="64" fill="#153d3a"><tspan x="0" y="0">How trees cool a street.</tspan></text>
    <text id="intro" transform="matrix(1 0 0 1 60 190)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="27" fill="#153d3a"><tspan x="0" y="0">Two connected processes help reduce urban heat.</tspan></text>
    <text id="shade-title" transform="matrix(1 0 0 1 60 278)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="30" fill="#153d3a"><tspan x="0" y="0">1 / SHADE</tspan></text>
    <text id="water-title" transform="matrix(1 0 0 1 660 278)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="28" fill="#153d3a"><tspan x="0" y="0">2 / EVAPOTRANSPIRATION</tspan></text>
    <text id="shade-copy" transform="matrix(1 0 0 1 60 735)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="25" fill="#153d3a"><tspan x="0" y="0">Leaves intercept sunlight.</tspan><tspan x="0" y="36">Less solar energy heats the surface.</tspan></text>
    <text id="water-copy" transform="matrix(1 0 0 1 660 735)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="25" fill="#153d3a"><tspan x="0" y="0">Water released through leaves</tspan><tspan x="0" y="36">evaporates, using heat from air.</tspan></text>
    <text id="note" transform="matrix(1 0 0 1 60 831)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="22" fill="#617b66"><tspan x="0" y="0">Effects depend on tree cover, water availability and local conditions.</tspan></text>
    <text id="source" transform="matrix(1 0 0 1 60 875)" x="0" y="0" xml:space="preserve" font-family="&apos;Segoe UI&apos;" font-size="20" fill="#617b66"><tspan x="0" y="0">Concept diagram | Source: US EPA, Benefits of Trees and Vegetation.</tspan></text>
